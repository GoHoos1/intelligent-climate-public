# cost-policy: allow-github-hosted
# Public-repository validation intentionally stays on GitHub-hosted runners so
# untrusted fork/PR code never executes on a home-network self-hosted runner.
name: HACS

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hacs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
          comment: false
          ignore: brands
