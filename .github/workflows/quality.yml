name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimum-home-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install minimum supported Home Assistant
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant==2026.7.0"

      - name: Import configuration flows on minimum Home Assistant
        run: |
          python - <<'PY'
          from custom_components.intelligent_climate import config_flow, zone_flow

          assert config_flow.IntelligentClimateConfigFlow
          assert zone_flow.ZoneSubentryFlowHandler
          PY

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Run network-isolated tests with coverage
        run: python -m pytest --cov=custom_components.intelligent_climate --cov-report=term-missing

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Run Ruff format check
        run: python -m ruff format --check .

      - name: Run mypy
        run: python -m mypy custom_components/intelligent_climate tests

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend quality gates
        working-directory: frontend
        run: npm run check

      - name: Build production frontend bundle
        working-directory: frontend
        run: npm run build

      - name: Verify committed production frontend bundle
        run: git diff --exit-code -- custom_components/intelligent_climate/frontend_dist/intelligent-climate-panel.js
