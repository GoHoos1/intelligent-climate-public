[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=69"]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[project]
name = "intelligent-climate"
version = "0.0.12"
description = "Read-only intelligent climate observation and Shadow planning for Home Assistant."
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = []

[project.optional-dependencies]
dev = [
  "home-assistant-frontend==20260624.6",
  "homeassistant",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-homeassistant-custom-component",
  "ruff",
]

[tool.pytest.ini_options]
addopts = [
  "-p",
  "no:cacheprovider",
  "--allow-unix-socket",
  "--disable-socket",
  "--strict-config",
  "--strict-markers",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components/intelligent_climate"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
explicit_package_bases = true
files = ["custom_components/intelligent_climate", "tests"]
no_implicit_optional = true
python_version = "3.14"
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "homeassistant.*",
  "pytest_homeassistant_custom_component.*",
  "voluptuous",
]
ignore_missing_imports = true
